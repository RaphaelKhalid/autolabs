name: Autolabs CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            orchestrator-worker/package-lock.json
      - name: Verify orchestrator
        working-directory: orchestrator-worker
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run deploy:dry
      - name: Verify deterministic calculator syntax
        run: node --check math-worker/run.mjs
      - name: Build public site
        run: |
          npm ci
          npm run build
